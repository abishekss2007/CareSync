name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite runs on synthetic demo data with no cloud services attached.
  DEMO_MODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax and undefined names
        run: |
          python -m pip install --quiet ruff
          ruff check --select E9,F63,F7,F82,F401,F811,F841 app tests reset_demo.py
          python -m compileall -q app tests reset_demo.py
      - name: JavaScript syntax
        run: node --check static/app.js

  test:
    name: End-to-end tests (Python ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Start the app
        run: |
          python -m uvicorn app.main:app --port 8000 > server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "The app did not start"; cat server.log; exit 1
      - name: Access rules and workflows
        run: python tests/smoke.py http://127.0.0.1:8000
      - name: Server log
        if: failure()
        run: cat server.log

  container:
    name: Container build and test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag caresync:ci .
      - name: Start container
        run: |
          docker run --detach --name caresync --publish 8000:8000 --env DEMO_MODE=1 caresync:ci
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "The container did not start"; docker logs caresync; exit 1
      - name: Run the suite against the container
        run: python3 tests/smoke.py http://127.0.0.1:8000
      - name: Container log
        if: failure()
        run: docker logs caresync

  publish:
    name: Publish image
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
